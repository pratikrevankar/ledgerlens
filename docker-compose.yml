services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ledgerlens
      POSTGRES_DB: ledgerlens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  backend:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql://ledgerlens:ledgerlens@db:5432/ledgerlens
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  pgdata:
